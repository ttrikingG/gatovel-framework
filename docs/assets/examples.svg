<svg width="320" height="84" viewBox="0 0 320 84" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Examples" shape-rendering="crispEdges" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="ex-content-clip">
      <path d="M14,10 L306,10 L306,14 L310,14 L310,70 L306,70 L306,74 L14,74 L14,70 L10,70 L10,14 L14,14 Z"/>
    </clipPath>
  </defs>

  <!-- outer frame (cyan) -->
  <path d="M8,0 L312,0 L312,8 L320,8 L320,76 L312,76 L312,84 L8,84 L8,76 L0,76 L0,8 L8,8 Z"
        fill="#4dd8ff"/>

  <!-- inner frame (deep blue) -->
  <path d="M12,6 L308,6 L308,12 L314,12 L314,72 L308,72 L308,78 L12,78 L12,72 L6,72 L6,12 L12,12 Z"
        fill="#142850"/>

  <!-- night-ocean stripes, clipped to stepped content shape -->
  <g clip-path="url(#ex-content-clip)">
    <rect x="10" y="10"   width="300" height="10.7" fill="#1b1a55"/>
    <rect x="10" y="20.7" width="300" height="10.6" fill="#274690"/>
    <rect x="10" y="31.3" width="300" height="10.7" fill="#2192c9"/>
    <rect x="10" y="42.0" width="300" height="10.7" fill="#1fc2d6"/>
    <rect x="10" y="52.7" width="300" height="10.6" fill="#4de3d1"/>
    <rect x="10" y="63.3" width="300" height="10.7" fill="#9ef7e8"/>
  </g>

  <!-- label with hard pixel drop-shadow -->
  <text x="163" y="47" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="20" font-weight="700" letter-spacing="2" fill="#142850">EXAMPLES</text>
  <text x="160" y="44" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="20" font-weight="700" letter-spacing="2" fill="#eafcff">EXAMPLES</text>
</svg>
