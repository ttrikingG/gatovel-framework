<svg width="320" height="84" viewBox="0 0 320 84" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Documentation" shape-rendering="crispEdges" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="doc-content-clip">
      <path d="M14,10 L306,10 L306,14 L310,14 L310,70 L306,70 L306,74 L14,74 L14,70 L10,70 L10,14 L14,14 Z"/>
    </clipPath>
  </defs>

  <!-- outer frame (teal) -->
  <path d="M8,0 L312,0 L312,8 L320,8 L320,76 L312,76 L312,84 L8,84 L8,76 L0,76 L0,8 L8,8 Z"
        fill="#2dd4bf"/>

  <!-- inner frame (deep teal) -->
  <path d="M12,6 L308,6 L308,12 L314,12 L314,72 L308,72 L308,78 L12,78 L12,72 L6,72 L6,12 L12,12 Z"
        fill="#073b3a"/>

  <!-- tropical stripes, clipped to stepped content shape -->
  <g clip-path="url(#doc-content-clip)">
    <rect x="10" y="10"   width="300" height="10.7" fill="#073b4c"/>
    <rect x="10" y="20.7" width="300" height="10.6" fill="#0a6e6e"/>
    <rect x="10" y="31.3" width="300" height="10.7" fill="#14a087"/>
    <rect x="10" y="42.0" width="300" height="10.7" fill="#4ade80"/>
    <rect x="10" y="52.7" width="300" height="10.6" fill="#a3e635"/>
    <rect x="10" y="63.3" width="300" height="10.7" fill="#fde68a"/>
  </g>

  <!-- label with hard pixel drop-shadow -->
  <text x="163" y="47" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="18" font-weight="700" letter-spacing="2" fill="#073b4c">DOCUMENTATION</text>
  <text x="160" y="44" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="18" font-weight="700" letter-spacing="2" fill="#f0fff4">DOCUMENTATION</text>
</svg>
